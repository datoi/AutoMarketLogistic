# Railway / Nixpacks deployment config.
# - composer.json declares ext-pdo_pgsql, so Nixpacks builds PHP with the Postgres driver.
# - Vite assets are built during the build phase.
# - Migrations run before the web server starts on every deploy.

[phases.build]
cmds = [
  "npm run build",
  "php artisan storage:link || true",
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
